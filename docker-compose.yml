version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tej-db
    environment:
      - POSTGRES_USER=tej_user
      - POSTGRES_PASSWORD=tej_password
      - POSTGRES_DB=tej_products
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tej_user -d tej_products"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tej-backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_PATH=/app/data/chats.db
    volumes:
      - backend-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: tej-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-data:
  postgres-data:

