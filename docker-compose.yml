version: '3.8'

services:
  backend:
    build: ./backend
    container_name: tej-backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_PATH=/app/data/chats.db
    volumes:
      - backend-data:/app/data
    restart: always

  frontend:
    build: ./frontend
    container_name: tej-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-data:
